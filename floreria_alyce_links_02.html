<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Alyce | Enlaces</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Paleta de colores basada en el logo */
        :root {
            --bg-color: #F3EFEA; /* Crema del fondo */
            --text-color: #111111; /* Negro elegante */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Contenedor de hojas animadas */
        #leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Permite hacer clic a través de las hojas */
            z-index: 0;
            overflow: hidden;
        }

        /* Estilo base de la hoja */
        .leaf {
            position: absolute;
            top: -10%;
            opacity: 0;
            animation: fall linear infinite;
            color: rgba(17, 17, 17, 0.15); /* Hojas en tono oscuro sutil */
        }

        /* Animación de caída */
        @keyframes fall {
            0% {
                opacity: 0;
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                top: 110%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* Efectos de Botones */
        .link-button {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }
        
        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        }

        /* Sombra suave para la imagen de perfil y carrete */
        .profile-shadow {
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.2);
        }

        /* Ocultar barra de scroll para el carrete de imágenes */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4">

    <!-- Contenedor para la animación de hojas -->
    <div id="leaves-container"></div>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md mx-auto relative z-10 flex flex-col items-center">
        
        <!-- Imagen de Perfil / Logo -->
        <div class="mb-6 relative">
            <div class="w-32 h-32 md:w-40 md:h-40 rounded-full overflow-hidden border-2 border-black profile-shadow bg-white flex items-center justify-center p-1">
                <!-- Usando la imagen solicitada -->
                <img src="logo.jpg" alt="Florería Alyce Logo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://placehold.co/400x400/F3EFEA/111111?text=FA'">
            </div>
            <!-- Pequeño adorno SVG opcional de hoja cerca de la foto -->
            <div class="absolute -bottom-2 -right-2 text-black animate-bounce" style="animation-duration: 3s;">

                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                </svg>
            </div>
        </div>

        <!-- Textos de Cabecera -->
        <h1 class="text-3xl font-bold tracking-widest uppercase text-center mb-1 text-black">
            Florería Alyce
        </h1>
        <p class="text-xs md:text-sm tracking-[0.2em] uppercase text-gray-700 text-center mb-8 font-light">
            Decoración y Diseño Floral
        </p>

        <!-- Carrete de Imágenes -->
        <div class="w-full mb-8 relative">
            <div class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide rounded-xl border border-black profile-shadow">
                <!-- Puedes cambiar el "src" por los enlaces de tus imágenes reales -->
                <img src="https://placehold.co/600x300/F3EFEA/111111?text=Arreglos" alt="Arreglos" class="min-w-full h-48 md:h-56 object-cover snap-center">
                <img src="https://placehold.co/600x300/F3EFEA/111111?text=Eventos" alt="Eventos" class="min-w-full h-48 md:h-56 object-cover snap-center">
                <img src="https://placehold.co/600x300/F3EFEA/111111?text=Bodas" alt="Bodas" class="min-w-full h-48 md:h-56 object-cover snap-center">
            </div>
            <!-- Indicador visual para que sepan que se puede deslizar -->
            <p class="text-[10px] text-center mt-3 text-gray-600 uppercase tracking-widest font-medium">
                <i class="fa-solid fa-arrows-left-right mr-1"></i> Desliza para ver más
            </p>
        </div>

        <!-- Enlaces / Botones -->
        <div class="w-full space-y-4 flex flex-col gap-2">
            
            <!-- Botón 1: Página Web Oficial -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-solid fa-globe text-xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Página Web Oficial</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Botón 2: Catálogo de Arreglos -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Catálogo de Arreglos</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Botón 3: Catálogo de Eventos -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-solid fa-calendar-days text-xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Catálogo de Eventos</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Botón 4: WhatsApp -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Cotiza por WhatsApp</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Botón 5: Facebook -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-brands fa-facebook text-2xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Nuestro Facebook</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">

            <!-- Botón 6: Instagram -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-brands fa-instagram text-2xl"></i>

                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">

            <!-- Botón 7: Pagos a transferencia -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">
                    <i class="fa-solid fa-money-bill-transfer text-xl"></i>
                </div>
                <span class="flex-1 text-center font-medium tracking-wide uppercase text-sm">Datos de Transferencia</span>
                <div class="w-8 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fa-solid fa-arrow-right"></i>

            </a>

            <!-- Botón 8: Ubicación -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">

            <!-- Botón 9: Opinión en Google Maps -->
            <a href="#" class="link-button group flex items-center justify-between w-full p-4 border border-black bg-transparent text-black hover:bg-black hover:text-[#F3EFEA] rounded-lg">
                <div class="w-8 flex justify-center">

        </div>

    </main>

    <!-- Footer / Redes Sociales Adicionales -->
    <footer class="mt-16 mb-8 text-center z-10">
        <p class="text-xs text-gray-500 font-light tracking-wider uppercase">
            © 2026 Florería Alyce
        </p>
    </footer>

    <!-- Script para la animación de las hojas -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const leavesContainer = document.getElementById('leaves-container');
            const numberOfLeaves = 15; // Cantidad de hojas simultáneas

            // SVG de una hoja minimalista
            const leafSVG = `
                <svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%">
                    <path d="M17.5,3C13.4,3,9.7,5.5,7.8,9C6.4,11.5,6.1,14.4,7.1,17.1c0.1,0.3,0.3,0.6,0.6,0.8l-3.3,3.3c-0.4,0.4-0.4,1,0,1.4 c0.2,0.2,0.5,0.3,0.7,0.3s0.5-0.1,0.7-0.3l3.3-3.3c0.3,0.3,0.6,0.5,1,0.6c2.7,1,5.6,0.7,8.1-0.7c3.5-1.9,6-5.6,6-9.7 C24,5,21,2,17.5,3z M15,16.5c-1.3,0.7-2.9,0.8-4.3,0.3l5.5-5.5c0.4-0.4,0.4-1,0-1.4s-1-0.4-1.4,0l-5.5,5.5c-0.5-1.4-0.4-3,0.3-4.3 C11.1,8.3,14,6.4,17.5,6.4C19.8,6.5,21.5,8.2,21.5,10.5C21.6,14,19.7,16.9,15,16.5z"/>
                </svg>
            `;

            for (let i = 0; i < numberOfLeaves; i++) {
                createLeaf();
            }

            function createLeaf() {
                const leaf = document.createElement('div');
                leaf.classList.add('leaf');
                leaf.innerHTML = leafSVG;

                // Propiedades aleatorias
                const size = Math.random() * 20 + 15; // Tamaño entre 15px y 35px
                const leftPosition = Math.random() * 100; // Posición horizontal (0% a 100%)
                const animationDuration = Math.random() * 10 + 10; // Duración entre 10s y 20s
                const animationDelay = Math.random() * 10; // Retraso entre 0s y 10s
                const rotationStart = Math.random() * 360; // Rotación inicial

                // Aplicar estilos
                leaf.style.width = `${size}px`;
                leaf.style.height = `${size}px`;
                leaf.style.left = `${leftPosition}%`;
                leaf.style.animationDuration = `${animationDuration}s`;
                leaf.style.animationDelay = `${animationDelay}s`;
                leaf.style.transform = `rotate(${rotationStart}deg)`;

                // Variación de dirección en la animación (unas a la derecha, otras izquierda)
                const drift = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 150 + 50);
                leaf.style.setProperty('--drift', `${drift}px`);

                leavesContainer.appendChild(leaf);

                // Recrear la hoja una vez que la animación termina para mantener el flujo
                leaf.addEventListener('animationend', () => {
                    leaf.remove();
                    createLeaf();
                });
            }
        });
    </script>
</body>
</html>
